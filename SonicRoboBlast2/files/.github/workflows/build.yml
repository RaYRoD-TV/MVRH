name: build

on:
  push:
    branches: [vr]
    tags: ['v*']
  pull_request:
    branches: [vr]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # tag pushes publish the GitHub release
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
      # Use vcpkg's own downloaded cmake/ninja, not the runner's rolling ones:
      # ports as old as yasm don't survive newer CMake major versions.
      VCPKG_FORCE_DOWNLOADED_BINARIES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # comptime stamps the commit + branch into the exe

      - name: Enable vcpkg binary caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # The runner's rolling vcpkg/CMake combo breaks older ports (yasm);
      # pin the same vcpkg revision the port is developed against. Full clone:
      # the manifest's builtin-baseline makes vcpkg read port versions out of
      # git history, so a partial/shallow clone starves it.
      - name: Pin vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg vcpkg-pinned
          git -C vcpkg-pinned checkout 782419385291ae2db643c928314efe626853c702
          & vcpkg-pinned\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg-pinned\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DSRB2_SDL2_EXE_NAME=srb2win

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\bin\Release\* dist\ -Exclude *.pdb
          Copy-Item INSTALL.txt dist\
          Compress-Archive -Path dist\* -DestinationPath SRB2-VR-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SRB2-VR-win64
          path: SRB2-VR-win64.zip

      # One-step install: repackage the official freely distributed game assets
      # (upstream's own Full zip, taken from the release named in UPSTREAM_BASE)
      # with this build's exe and DLLs. Unzip anywhere, run srb2win.exe.
      - name: Package full bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = (Get-Content .github/UPSTREAM_BASE).Trim()
          $short = 'v' + (($base -replace 'SRB2_release_', '') -replace '\.', '')
          gh release download $base -R STJr/SRB2 --pattern "SRB2-$short-Full.zip" --dir .
          Expand-Archive "SRB2-$short-Full.zip" -DestinationPath full
          Copy-Item dist\* full\ -Recurse -Force
          Compress-Archive -Path full\* -DestinationPath SRB2-VR-full-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" SRB2-VR-full-win64.zip SRB2-VR-win64.zip
          --title "SRB2-VR ${{ github.ref_name }}"
          --generate-notes
          --latest
